name: Update Scan Universe (S&P500 + Nasdaq-100)

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Update universe
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run update-universe
